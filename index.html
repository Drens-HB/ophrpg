<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0909">
  <title>Yoru</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="book-scene" aria-label="Manga de Yoru">
    <div class="book" id="book">
      <div class="page-shadow"></div>
      <div class="page-under" id="page-under"></div>
      <div class="page current" id="page-current">
        <img id="current-image" src="assets/pages/1.png" alt="Página 1">
      </div>
      <div class="page flip-leaf" id="flip-leaf" aria-hidden="true">
        <img id="flip-image" src="assets/pages/1.png" alt="">
      </div>
    </div>

    <button class="nav prev" id="prev" type="button" aria-label="Página anterior" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg>
    </button>
    <button class="nav next" id="next" type="button" aria-label="Página siguiente">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8"/></svg>
    </button>
  </main>
  <script src="app.js"></script>
</body>
</html>
